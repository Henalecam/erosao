<script>// Fluido SPH viscoelástico 3D (Clavet, Beaudoin & Poulin 2005), unidades: metros, tempo em passos.
function createFluid(o){
  const MAXP=o.max, h=o.h, h2=h*h, sp=o.spacing;
  const px=new Float32Array(MAXP),py=new Float32Array(MAXP),pz=new Float32Array(MAXP);
  const vx=new Float32Array(MAXP),vy=new Float32Array(MAXP),vz=new Float32Array(MAXP);
  const ox=new Float32Array(MAXP),oy=new Float32Array(MAXP),oz=new Float32Array(MAXP);
  const kind=new Uint8Array(MAXP),mat=new Uint8Array(MAXP),ground=new Uint8Array(MAXP),dead=new Uint8Array(MAXP);
  const [X0,Y0,Z0,X1,Y1,Z1]=o.bounds;
  const NX=Math.ceil((X1-X0)/h)+1,NY=Math.ceil((Y1-Y0)/h)+1,NZ=Math.ceil((Z1-Z0)/h)+1;
  const head=new Int32Array(NX*NY*NZ),next=new Int32Array(MAXP),pcell=new Int32Array(MAXP);
  const MAXN=56;const nb=new Int32Array(MAXP*MAXN),nd=new Float32Array(MAXP*MAXN),nc=new Uint8Array(MAXP);
  const dens=new Float32Array(MAXP),densN=new Float32Array(MAXP);
  const avx=new Float32Array(MAXP),avy=new Float32Array(MAXP),avz=new Float32Array(MAXP),awn=new Float32Array(MAXP);
  // densidade de repouso calculada numa malha ideal com o espaçamento desejado
  let REST=0;{const m=Math.ceil(h/sp)+1;for(let i=-m;i<=m;i++)for(let j=-m;j<=m;j++)for(let k=-m;k<=m;k++){if(!i&&!j&&!k)continue;const r=sp*Math.sqrt(i*i+j*j+k*k);if(r<h){const q=1-r/h;REST+=q*q;}}}
  const F={MAXP,h,REST,px,py,pz,vx,vy,vz,ox,oy,oz,kind,mat,ground,np:0,
    K:o.K,KN:o.KN,G:o.G,BETA:o.BETA,SIGMA:o.SIGMA||0,MAXV:o.maxV,
    used:new Int32Array(MAXP),nUsed:0};
  function cellOf(x,y,z){let cx=((x-X0)/h)|0,cy=((y-Y0)/h)|0,cz=((z-Z0)/h)|0;
    if(cx<0)cx=0;else if(cx>=NX)cx=NX-1;if(cy<0)cy=0;else if(cy>=NY)cy=NY-1;if(cz<0)cz=0;else if(cz>=NZ)cz=NZ-1;return (cz*NY+cy)*NX+cx;}
  let touched=new Int32Array(MAXP);let nt=0;
  function build(){const n=F.np;for(let k=0;k<nt;k++)head[touched[k]]=-1;nt=0;
    for(let i=0;i<n;i++){const c=cellOf(px[i],py[i],pz[i]);pcell[i]=c;if(head[c]===-1)touched[nt++]=c;next[i]=head[c];head[c]=i;}}
  head.fill(-1);
  function find(){const n=F.np;
    for(let i=0;i<n;i++){let cnt=0;const x=px[i],y=py[i],z=pz[i];const c=pcell[i];
      const cx=c%NX,cy=((c/NX)|0)%NY,cz=(c/(NX*NY))|0;const b=i*MAXN;
      for(let gz=cz-1;gz<=cz+1;gz++){if(gz<0||gz>=NZ)continue;for(let gy=cy-1;gy<=cy+1;gy++){if(gy<0||gy>=NY)continue;
        let base=(gz*NY+gy)*NX;for(let gx=cx-1;gx<=cx+1;gx++){if(gx<0||gx>=NX)continue;
          for(let j=head[base+gx];j!==-1;j=next[j]){if(j<=i)continue;const dx=px[j]-x,dy=py[j]-y,dz=pz[j]-z;const r2=dx*dx+dy*dy+dz*dz;
            if(r2<h2&&cnt<MAXN){nb[b+cnt]=j;nd[b+cnt]=Math.sqrt(r2);cnt++;}}}}}
      nc[i]=cnt;}}
  F.add=function(x,y,z,u,v,w,k,m){if(F.np>=MAXP)return -1;const i=F.np++;nc[i]=0;dead[i]=0;px[i]=ox[i]=x;py[i]=oy[i]=y;pz[i]=oz[i]=z;vx[i]=u;vy[i]=v;vz[i]=w;kind[i]=k||0;mat[i]=m||0;ground[i]=0;return i;};
  F.kill=function(i){if(dead[i])return false;dead[i]=1;F.nDead++;return true;};
  F.nDead=0;F.dead=dead;
  // compactação estável: mantém a ordem e remapeia as listas de vizinhos
  const remap=new Int32Array(MAXP);
  F.compact=function(){if(!F.nDead)return;const n=F.np;let j=0;
    for(let i=0;i<n;i++){if(dead[i]){remap[i]=-1;continue;}remap[i]=j;
      if(j!==i){px[j]=px[i];py[j]=py[i];pz[j]=pz[i];vx[j]=vx[i];vy[j]=vy[i];vz[j]=vz[i];ox[j]=ox[i];oy[j]=oy[i];oz[j]=oz[i];kind[j]=kind[i];mat[j]=mat[i];ground[j]=ground[i];}
      j++;}
    for(let i=0;i<n;i++){const ni=remap[i];if(ni<0)continue;const b=i*MAXN,c=nc[i],nb2=ni*MAXN;let k2=0;
      for(let k=0;k<c;k++){const t=remap[nb[b+k]];if(t>=0){nb[nb2+k2]=t;nd[nb2+k2]=nd[b+k];k2++;}}nc[ni]=k2;}
    for(let i=0;i<j;i++)dead[i]=0;
    F.np=j;F.nDead=0;if(F.listN>0)F.listN=j;};
  F.step=function(collide){
    const n=F.np,K=F.K,KN=F.KN,G=F.G,BETA=F.BETA,SIGMA=F.SIGMA;
    for(let i=0;i<n;i++)vy[i]-=kind[i]?G*2.2:G;
    // viscosidade + arrasto dos grãos (usa a lista de vizinhos do passo anterior, distâncias recalculadas)
    for(let i=0;i<n;i++){avx[i]=avy[i]=avz[i]=awn[i]=0;}
    if(F.listN>0){for(let i=0;i<n;i++){const b=i*MAXN,c=nc[i];for(let k=0;k<c;k++){const j=nb[b+k];
      let nx=px[j]-px[i],ny=py[j]-py[i],nz=pz[j]-pz[i];const r=Math.sqrt(nx*nx+ny*ny+nz*nz);if(r<1e-6||r>=h)continue;nx/=r;ny/=r;nz/=r;
      const u=(vx[i]-vx[j])*nx+(vy[i]-vy[j])*ny+(vz[i]-vz[j])*nz;
      if(u>0){const q=1-r/h;const I=q*(SIGMA*u+BETA*u*u)*.5;vx[i]-=I*nx;vy[i]-=I*ny;vz[i]-=I*nz;vx[j]+=I*nx;vy[j]+=I*ny;vz[j]+=I*nz;}
      if(kind[i]&&!kind[j]){avx[i]+=vx[j];avy[i]+=vy[j];avz[i]+=vz[j];awn[i]++;}
      if(kind[j]&&!kind[i]){avx[j]+=vx[i];avy[j]+=vy[i];avz[j]+=vz[i];awn[j]++;}}}}
    for(let i=0;i<n;i++){if(kind[i]){if(awn[i]>=2){const d=.12,w=1/awn[i];vx[i]+=(avx[i]*w-vx[i])*d;vz[i]+=(avz[i]*w-vz[i])*d;vy[i]+=(avy[i]*w-vy[i])*d*.4;}
      else if(ground[i]){vx[i]*=.6;vz[i]*=.6;}}}
    for(let i=0;i<n;i++){ox[i]=px[i];oy[i]=py[i];oz[i]=pz[i];px[i]+=vx[i];py[i]+=vy[i];pz[i]+=vz[i];}
    build();find();F.listN=n;
    // relaxação de dupla densidade
    for(let i=0;i<n;i++){dens[i]=0;densN[i]=0;}
    for(let i=0;i<n;i++){const b=i*MAXN,c=nc[i];for(let k=0;k<c;k++){const j=nb[b+k];const q=1-nd[b+k]/h;const q2=q*q,q3=q2*q;dens[i]+=q2;densN[i]+=q3;dens[j]+=q2;densN[j]+=q3;}}
    for(let i=0;i<n;i++){let P=K*(dens[i]-REST);if(P<0)P*=.6;const PN=KN*densN[i];const b=i*MAXN,c=nc[i];let dx=0,dy=0,dz=0;
      for(let k=0;k<c;k++){const j=nb[b+k],r=nd[b+k];if(r<1e-6)continue;const q=1-r/h;
        let Pj=K*(dens[j]-REST);if(Pj<0)Pj*=.6;const D=((P+Pj)*.5*q+(PN+KN*densN[j])*.5*q*q)*.5/r;
        const ux=(px[j]-px[i])*D,uy=(py[j]-py[i])*D,uz=(pz[j]-pz[i])*D;
        px[j]+=ux;py[j]+=uy;pz[j]+=uz;dx-=ux;dy-=uy;dz-=uz;}
      px[i]+=dx;py[i]+=dy;pz[i]+=dz;}
    collide();
    const MV=F.MAXV,MV2=MV*MV;
    for(let i=0;i<n;i++){let u=px[i]-ox[i],v=py[i]-oy[i],w=pz[i]-oz[i];const s=u*u+v*v+w*w;if(s>MV2){const k=MV/Math.sqrt(s);u*=k;v*=k;w*=k;}vx[i]=u;vy[i]=v;vz[i]=w;}
  };
  F.neighborCount=i=>nc[i];
  F.density=dens;
  return F;
}
if(typeof module!=='undefined')module.exports={createFluid};
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const R=Math.random;

// =================================================================
// Estado & upgrades
// =================================================================
const KEY='erosao3d_v1';
const S={money:0,level:1,total:0,sluice:0,t:Date.now(),up:{gota:0,chuva:0,altura:0,acido:0,nuvem:0,calha:0,riffle:0,auto:0},found:{}};
try{const sv=JSON.parse(localStorage.getItem(KEY)||'null');if(sv){Object.assign(S,sv);S.up=Object.assign({gota:0,chuva:0,altura:0,acido:0,nuvem:0,calha:0,riffle:0,auto:0},sv.up||{});S.found=sv.found||{};}}catch(e){}
const save=()=>{S.t=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
const dropN=l=>12+l*6, rainRate=l=>l*2.5, dropH=l=>.55+l*.22, acid=l=>Math.pow(1.3,l), cloudRate=l=>l*.6,
      cap=l=>Math.round(25*Math.pow(1.7,l)), capture=l=>Math.min(.92,.32+l*.08), autoWash=l=>l?Math.max(4,32-l*4):0;
const UPS=[
 {k:'gota',c:'Água',n:'Gota maior',d:l=>`${dropN(l)} partículas por gota`,base:8,mul:1.5},
 {k:'chuva',c:'Água',n:'Chuva',d:l=>l?`Segure: ${rainRate(l)} gotas/s`:'Segure o clique para chover',base:40,mul:1.65},
 {k:'altura',c:'Água',n:'Altura da queda',d:l=>`${dropH(l).toFixed(2)} m · mais impacto`,base:25,mul:1.6,max:10},
 {k:'acido',c:'Água',n:'Acidez',d:l=>`Erosão ×${acid(l).toFixed(2)}`,base:30,mul:1.7},
 {k:'nuvem',c:'Idle',n:'Nuvem',d:l=>l?`Chove sozinha ${cloudRate(l).toFixed(1)}/s`:'Uma nuvem que chove sozinha',base:120,mul:1.7},
 {k:'calha',c:'Garimpo',n:'Calha maior',d:l=>`Capacidade $${cap(l)}`,base:35,mul:1.75},
 {k:'riffle',c:'Garimpo',n:'Riffles',d:l=>`Retém ${Math.round(capture(l)*100)}% dos grãos`,base:45,mul:1.8,max:8},
 {k:'auto',c:'Garimpo',n:'Lavagem automática',d:l=>l?`Lava a cada ${autoWash(l)} s`:'Lava a calha sozinha',base:250,mul:1.9,max:7},
];
const costOf=u=>Math.floor(u.base*Math.pow(u.mul,S.up[u.k]));

// =================================================================
// Ruído
// =================================================================
function hash3(x,y,z,s){let h=(x*374761393+y*668265263+z*1440662683+s*1013904223)|0;h=Math.imul(h^(h>>>13),1274126177);return ((h^(h>>>16))>>>0)/4294967295;}
function vnoise(x,y,z,s){const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z);const xf=x-xi,yf=y-yi,zf=z-zi;const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),w=zf*zf*(3-2*zf);
  const a=hash3(xi,yi,zi,s),b=hash3(xi+1,yi,zi,s),c=hash3(xi,yi+1,zi,s),d=hash3(xi+1,yi+1,zi,s),e=hash3(xi,yi,zi+1,s),f=hash3(xi+1,yi,zi+1,s),g=hash3(xi,yi+1,zi+1,s),h=hash3(xi+1,yi+1,zi+1,s);
  return ((a*(1-u)+b*u)*(1-v)+(c*(1-u)+d*u)*v)*(1-w)+((e*(1-u)+f*u)*(1-v)+(g*(1-u)+h*u)*v)*w;}
const fbm=(x,y,z,s,o=4)=>{let a=0,amp=.5,f=1,n=0;for(let i=0;i<o;i++){a+=vnoise(x*f,y*f,z*f,s+i*17)*amp;n+=amp;amp*=.5;f*=2.03;}return a/n;};
const ridge=(x,y,z,s)=>1-Math.abs(vnoise(x,y,z,s)*2-1);

// =================================================================
// Terreno (bacia em volta da rocha, canal até a calha)
// =================================================================
const CH_X0=1.75,CH_X1=4.7,CH_W=.2,SL_X0=2.55,SL_X1=4.45;
function terrainRaw(x,z){
  const r=Math.hypot(x,z);
  let h=.07*(r-1.75)*(r-1.75)-.13-.075*x+(r>4?.05*(r-4)*(r-4):0);
  h+=(fbm(x*.9,0,z*.9,7,3)-.5)*.08*Math.min(1,Math.max(0,(r-1.5)/1.5));
  if(r<1.35)h=Math.max(h,-.02+(1.35-r)*.04);
  return h;}
function chanBed(x){return terrainRaw(CH_X0,0)-.02-(x-CH_X0)*.06;}
function terrainH(x,z){
  let h=terrainRaw(x,z);
  if(x>CH_X0-.3){const az=Math.abs(z);const t=Math.min(1,(x-CH_X0+.3)/.3);
    const bed=chanBed(Math.max(x,CH_X0));
    if(az<CH_W)h=h*(1-t)+Math.min(h,bed)*t;
    else if(az<CH_W+.35&&x>CH_X0)h=Math.max(h,bed+.06+(az-CH_W)*.5);}
  return h;}

// =================================================================
// Rocha voxel
// =================================================================
const V=.022,GX=128,GY=104,GZ=128,GN=GX*GY*GZ;
const RX0=-GX*V/2,RZ0=-GZ*V/2,RY0=terrainRaw(0,0)-.04;
const vt=new Uint8Array(GN),vhp=new Float32Array(GN),vr=new Uint8Array(GN),vg=new Uint8Array(GN),vb=new Uint8Array(GN);
const vid=(x,y,z)=>x+GX*(y+GY*z);
// tipos
const T_SAND=1,T_SAND2=2,T_GRAN=3,T_QTZ=4,T_GOLD=5,T_AME=6,T_MOSS=7,T_CRACK=8,T_IRON=9;
const MATS={
 [T_SAND]:{n:'arenito',hp:.3,val:.5},[T_SAND2]:{n:'arenito duro',hp:.6,val:.7},[T_GRAN]:{n:'granito',hp:.9,val:1.2},
 [T_QTZ]:{n:'quartzo',hp:1.2,val:3},[T_GOLD]:{n:'ouro',hp:.8,val:45},[T_AME]:{n:'ametista',hp:1.1,val:90},
 [T_MOSS]:{n:'musgo',hp:.12,val:.2},[T_CRACK]:{n:'fissura',hp:.1,val:.5},[T_IRON]:{n:'óxido de ferro',hp:.45,val:1},
};
let rockInfo={name:'',total:1,left:1};
function srgb(c){return c;}
function genRock(level){
  vt.fill(0);
  const seed=level*7919+((R()*9999)|0);
  const kind=level===1?'arenito':level===2?'granito':level===3?'geodo':(['arenito','granito','geodo'][(R()*3)|0]);
  const cx=GX/2,cz=GZ/2;const sc=Math.min(1.25,1+(level-1)*.04);
  const ax=1.18*sc,ay=.98*sc,az=1.04*sc;const cy=ay*.78;
  // planos de faceta (cortes de rocha)
  const planes=[];for(let k=0;k<9;k++){const th=R()*Math.PI*2,ph=Math.acos(R()*1.6-.6);const n=[Math.sin(ph)*Math.cos(th),Math.cos(ph),Math.sin(ph)*Math.sin(th)];planes.push({n,o:.78+R()*.25});}
  const sN=[Math.sin(.35)*.3,1,Math.cos(.35)*.25];const sl=Math.hypot(...sN);sN[0]/=sl;sN[1]/=sl;sN[2]/=sl;
  const pal=kind==='granito'?null:[[186,160,128],[170,138,106],[152,116,88],[198,180,152],[136,104,80],[176,150,118],[160,140,120]];
  let cnt=0;
  for(let z=0;z<GZ;z++)for(let y=0;y<GY;y++)for(let x=0;x<GX;x++){
    const px=(x+.5-cx)*V,py=(y+.5)*V-cy,pz=(z+.5-cz)*V;
    if(Math.hypot(px/ax,py/ay,pz/az)>1.38)continue;

  const ok=c=>{if(!ac||muted||budget<c)return false;budget-=c;return true;};
  function tone(f,d,v,w,sl,dl){const o=ac.createOscillator();o.type=w||'sine';const t=ac.currentTime+(dl||0);o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(f*sl,t+d);const g=ac.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(master);o.start(t);o.stop(t+d+.02);}
  function nz(f,ft,d,v,q){const s=ac.createBufferSource();s.buffer=nb;const fl=ac.createBiquadFilter();fl.type=ft;fl.frequency.value=f;if(q)fl.Q.value=q;const g=ac.createGain();const t=ac.currentTime;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl).connect(g).connect(master);s.start(t,R()*2);s.stop(t+d+.02);}
  function bird(){const b=2600+R()*1800;const n=2+(R()*4|0);for(let k=0;k<n;k++)tone(b*(1+(R()-.5)*.2),.08+R()*.06,.025,'sine',1.25+R()*.3,k*.11);}
  return{init,toggle(){muted=!muted;if(flowG){flowG.gain.value=0;windG.gain.value=muted?0:.05;}return muted;},
    frame(motion){budget=Math.min(6,budget+.3);if(ac&&!muted){flowG.gain.setTargetAtTime(Math.min(.35,motion*.0009),ac.currentTime,.2);flowF.frequency.setTargetAtTime(600+Math.min(1600,motion*.6),ac.currentTime,.3);}},
    drip(){if(!ok(.5))return;tone(900+R()*500,.14,.05,'sine',.55);},
    drop(k){if(!ok(1))return;const f=380+R()*700;tone(f,.09+k*.06,.07*k+.02,'sine',2.2);nz(3500,'highpass',.05,.025*k);},
    crumble(t){if(R()>.35||!ok(1))return;if(t===T_QTZ||t===T_AME)tone(3200+R()*2600,.12,.025,'triangle');else if(t===T_GOLD)tone(2100+R()*400,.15,.04,'triangle');else nz(1200+R()*1800,'bandpass',.05,.07,1.5);},
    rumble(k){if(!ac||muted)return;nz(160,'lowpass',.8,.5*k+.15);tone(55,.6,.25*k+.08,'sine',.6);},
    coin(v){if(!ok(1))return;const p=Math.min(16,Math.log2(1+v)*1.5);const f=620*Math.pow(2,p/12);tone(f,.14,.06);tone(f*1.5,.18,.045,'sine',0,.06);},
    wash(){if(!ac||muted)return;nz(1400,'bandpass',.6,.25,.6);[784,988,1175,1568].forEach((f,j)=>tone(f,.25,.06,'triangle',0,.1+j*.07));},
    reveal(){if(!ac||muted)return;[1047,1319,1568,2093].forEach((f,j)=>tone(f,.4,.06,'sine',0,j*.09));},
  };})();

// =================================================================
// UI
// =================================================================
const $=id=>document.getElementById(id);
function fmt(n){if(n<100)return n.toFixed(n<10?2:1).replace('.',',');n=Math.floor(n);if(n<1e5)return n.toLocaleString('pt-BR');const u=['','K','M','B','T'];let k=0,v=n;while(v>=1000&&k<4){v/=1000;k++;}return v.toFixed(v<10?2:1).replace('.',',')+u[k];}
const btns=UPS.map(u=>{const b=document.createElement('button');b.className='up';b.onclick=()=>{sfx.init();const c=costOf(u);if(S.money<c||(u.max!==undefined&&S.up[u.k]>=u.max))return;S.money-=c;S.up[u.k]++;sfx.coin(c);
  if(u.k==='chuva'&&S.up.chuva===1)toast('Chuva','Segure o clique sobre a rocha');if(u.k==='nuvem'&&S.up.nuvem===1)toast('Uma nuvem chegou','Ela chove sozinha enquanto você joga');save();ui();};$('ups').appendChild(b);return b;});
function wash(){if(S.sluice<.01)return;const v=S.sluice;S.money+=v;S.total+=v;earnBatch+=v;S.sluice=0;sfx.wash();
  const p=new THREE.Vector3((SL_X0+SL_X1)/2,chanBed((SL_X0+SL_X1)/2)+.25,0);floatText(p,'+$'+fmt(v),'#ffe08a',26);save();ui();}
$('wash').onclick=()=>{sfx.init();wash();};
addEventListener('keydown',e=>{if(e.key==='l'||e.key==='L'){sfx.init();wash();}});
function ui(){
  $('money').textContent='$'+fmt(S.money);const r=earnHist.length?earnHist.reduce((a,b)=>a+b,0)/(earnHist.length):0;$('rate').textContent='$'+fmt(r)+'/s em média';
  $('rockName').textContent=rockInfo.name;const pct=(1-rockInfo.left/rockInfo.total)*100;$('rockSub').textContent=pct.toFixed(pct<10?2:1).replace('.',',')+'% erodido · nível '+S.level;$('rockBar').style.width=Math.min(100,pct/0.85)+'%';
  const c=cap(S.up.calha);$('sluiceTxt').textContent='$'+fmt(S.sluice)+' / $'+fmt(c)+(lostBatchShown>0?' · perdeu $'+fmt(lostBatchShown):'');$('sluiceBar').style.width=Math.min(100,S.sluice/c*100)+'%';
  $('wash').disabled=S.sluice<.01;$('wash').classList.toggle('full',S.sluice>=c*.98);
  UPS.forEach((u,j)=>{const b=btns[j],l=S.up[u.k],mx=u.max!==undefined&&l>=u.max,c2=costOf(u);const h=`<div class="cat">${u.c}</div><b>${u.n}${l?` · ${l}`:''}</b><span>${u.d(l)}</span><span class="c">${mx?'✓ máximo':'$'+fmt(c2)}</span>`;if(b._h!==h){b.innerHTML=h;b._h=h;}b.disabled=mx||S.money<c2;b.classList.toggle('ok',!mx&&S.money>=c2);});
}
let lostBatchShown=0;
const fts=[];const v3=new THREE.Vector3();
function floatText(p,t,c,sz){const el=document.createElement('div');el.className='ft';el.textContent=t;el.style.color=c;el.style.fontSize=(sz||20)+'px';document.body.appendChild(el);fts.push({el,p:p.clone(),life:80});}
function updTexts(){for(let k=fts.length-1;k>=0;k--){const f=fts[k];f.life--;f.p.y+=.004;if(f.life<=0){f.el.remove();fts.splice(k,1);continue;}
  v3.copy(f.p).project(camera);f.el.style.left=((v3.x+1)/2*innerWidth)+'px';f.el.style.top=((1-v3.y)/2*innerHeight)+'px';f.el.style.opacity=Math.min(1,f.life/25);}}
let tt=0;function toast(a,b){$('toast').innerHTML=a+(b?`<small>${b}</small>`:'');$('toast').style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>$('toast').style.opacity=0,2600);}
function discover(a,b,x,y,z){toast(a,b);sfx.reveal();floatText(new THREE.Vector3(x,y+.1,z),'✦','#ffe9a0',30);}
$('hint').ondblclick=null;

// =================================================================
// Loop
// =================================================================
let shake=0,frames=0,acc=0,last=performance.now(),washT=0,earnT=0;
function newRock(){genRock(S.level);rebuildAll();structDirty=false;}
function simFrame(){
  erosionMul=acid(S.up.acido);splashBudget=3;
  // segurar = chuva
  if(down&&aim&&S.up.chuva){holdAcc+=rainRate(S.up.chuva)/60;while(holdAcc>=1){holdAcc--;const p=aim.clone();p.x+=(R()-.5)*.12;p.z+=(R()-.5)*.12;spawnDrop(p,dropN(S.up.gota),dropH(S.up.altura));}}
  // nuvem
  if(S.up.nuvem){cloud.visible=true;cloudT+=1/60;const cx=Math.sin(cloudT*.21)*.55,cz=Math.cos(cloudT*.17)*.45;cloud.position.lerp(new THREE.Vector3(cx,RY0+GY*V+.9,cz),.03);
    cloudAcc+=cloudRate(S.up.nuvem)/60;while(cloudAcc>=1){cloudAcc--;const p=new THREE.Vector3(cloud.position.x+(R()-.5)*.6,cloud.position.y-1.1,cloud.position.z+(R()-.5)*.4);
      // gota cai de dentro da nuvem
      spawnDrop(new THREE.Vector3(p.x,cloud.position.y-.15-.1,p.z),dropN(S.up.gota),0);}}
  F.step(collide);postStep();F.step(collide);postStep();
  if(structDirty){structT++;if(structT>40){structT=0;checkStructure();}}
  // lavagem automática
  if(S.up.auto){washT+=1/60;if(washT>=autoWash(S.up.auto)&&S.sluice>0){washT=0;wash();}}
  earnT++;if(earnT>=60){earnT=0;earnHist.push(earnBatch);if(earnHist.length>20)earnHist.shift();earnBatch=0;lostBatchShown=lostBatch;lostBatch=0;
    if(sluiceAdd>0){const p=new THREE.Vector3((SL_X0+SL_X1)/2,chanBed(SL_X0)+.12,0);floatText(p,'+$'+fmt(sluiceAdd),'#ffd970',16);sfx.coin(sluiceAdd);sluiceAdd=0;}}
  if(rockInfo.left<=rockInfo.total*.15&&!rockInfo.done){rockInfo.done=true;const bonus=Math.round(80*S.level*valMult());S.money+=bonus;toast(rockInfo.name+' desfeito!','Bônus +$'+fmt(bonus)+' · uma nova rocha vem aí');sfx.reveal();S.level++;save();setTimeout(newRock,3500);}
  if(frames%300===0)save();
}
const M4=new THREE.Matrix4(),Cc=new THREE.Color();
function render(time){
  // partículas → buffers
  const pa=ptsGeo.attributes.position.array,ka=ptsKind.array;let g=0;
  const gm=grainMesh.instanceMatrix.array,gc=grainMesh.instanceColor.array;
  for(let i=0;i<F.np;i++){pa[i*3]=F.px[i];pa[i*3+1]=F.py[i];pa[i*3+2]=F.pz[i];ka[i]=F.kind[i];
    if(F.kind[i]){const o=g*16;gm[o]=1;gm[o+1]=0;gm[o+2]=0;gm[o+3]=0;gm[o+4]=0;gm[o+5]=1;gm[o+6]=0;gm[o+7]=0;gm[o+8]=0;gm[o+9]=0;gm[o+10]=1;gm[o+11]=0;gm[o+12]=F.px[i];gm[o+13]=F.py[i];gm[o+14]=F.pz[i];gm[o+15]=1;
      const m=F.mat[i];const c=m===T_GOLD?[1,.62,.12]:m===T_AME?[.35,.1,.55]:m===T_QTZ?[.8,.78,.74]:m===T_MOSS?[.08,.13,.04]:m===T_IRON?[.3,.08,.03]:m===T_GRAN?[.3,.25,.24]:[.55,.4,.25];
      gc[g*3]=c[0];gc[g*3+1]=c[1];gc[g*3+2]=c[2];g++;}}
  ptsGeo.attributes.position.needsUpdate=true;ptsKind.needsUpdate=true;ptsGeo.setDrawRange(0,F.np);
  grainMesh.count=g;grainMesh.instanceMatrix.needsUpdate=true;grainMesh.instanceColor.needsUpdate=true;
  // pilha de ouro na calha
  const pile=sluiceGroup.userData.pile;pile.scale.y=Math.max(.01,S.sluice/cap(S.up.calha))*1.8;pile.visible=S.sluice>0;
  if(window.__grass&&window.__grass.userData.sh)window.__grass.userData.sh.uniforms.uT.value=time;
  // cursor
  if(aim&&performance.now()-lastMove<4000){marker.visible=true;marker.position.copy(aim);marker.position.y+=.004;marker.lookAt(camera.position);marker.material.opacity=.45+Math.sin(time*5)*.25;}else marker.visible=false;
  // câmera
  controls.update();let sx=0,sy=0;if(shake>.0005){sx=(R()-.5)*shake;sy=(R()-.5)*shake;camera.position.x+=sx;camera.position.y+=sy;shake*=.88;}
  camera.updateMatrixWorld();
  // 1 cena
  renderer.setRenderTarget(sceneRT);renderer.clear();renderer.render(scene,camera);
  // 2 profundidade da água
  depthMat.uniforms.tSceneDepth.value=sceneRT.depthTexture;depthMat.uniforms.uRes.value.set(depthRT.width,depthRT.height);
  renderer.setRenderTarget(depthRT);renderer.setClearColor(0x000000,0);renderer.clear();renderer.render(fluidScene,camera);
  // 3 espessura
  thickMat.uniforms.uRes.value.set(thickRT.width,thickRT.height);
  renderer.setRenderTarget(thickRT);renderer.clear();renderer.render(thickScene,camera);
  depthMat.uniforms.uRes.value.set(depthRT.width,depthRT.height);
  // 4 blur bilateral (2 iterações)
  let src=depthRT,dst=blurA;
  for(let it=0;it<3;it++){blurMat.uniforms.tD.value=src.texture;blurMat.uniforms.uDir.value.set(1/depthRT.width,0);blurMat.uniforms.uScale.value=3.2;renderer.setRenderTarget(dst);renderer.render(blurScene,quadCam);
    src=dst;dst=dst===blurA?blurB:blurA;blurMat.uniforms.tD.value=src.texture;blurMat.uniforms.uDir.value.set(0,1/depthRT.height);renderer.setRenderTarget(dst);renderer.render(blurScene,quadCam);src=dst;dst=dst===blurA?blurB:blurA;}
  // 5 composição
  compMat.uniforms.tFluid.value=src.texture;compMat.uniforms.uInvProj.value.copy(camera.projectionMatrixInverse);
  compMat.uniforms.uCamRot.value.setFromMatrix4(camera.matrixWorld);compMat.uniforms.uSunV.value.copy(SUN_DIR).transformDirection(camera.matrixWorldInverse);
  renderer.setRenderTarget(null);renderer.render(compScene,quadCam);
  camera.position.x-=sx;camera.position.y-=sy;
}
function loop(now){
  const dt=Math.min(100,now-last);last=now;acc+=dt;let n=0;
  while(acc>=1000/60&&n<2){simFrame();acc-=1000/60;n++;frames++;}if(n===2)acc=0;
  rebuildDirty(6);
  let motion=0;for(let i=0;i<F.np;i+=3)motion+=Math.abs(F.vx[i])+Math.abs(F.vy[i])+Math.abs(F.vz[i]);sfx.frame(motion*HZ*.3);
  if(!SIMONLY){render(now/1000);updTexts();}
  if(frames%8===0)ui();
  requestAnimationFrame(loop);
}
resize();
setTimeout(()=>{newRock();ui();$('loading').style.opacity=0;setTimeout(()=>$('loading').remove(),900);requestAnimationFrame(loop);},30);
window.__dbg={DBG,setRender(v){SIMONLY=!v;},cam:camera,ctl:controls,get frames(){return frames},F,S,rockInfo:()=>rockInfo,spawnDrop:(x,y,z,n,h)=>spawnDrop(new THREE.Vector3(x,y,z),n,h)};
addEventListener('visibilitychange',()=>{if(document.hidden)save();});
</script>
